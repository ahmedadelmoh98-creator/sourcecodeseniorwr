# ---------------- MySQL ----------------
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db01
  namespace: vprofile
spec:
  serviceName: db01
  replicas: 1
  selector:
    matchLabels:
      app: db01
  template:
    metadata:
      labels:
        app: db01
        tier: data
    spec:
      containers:
        - name: db01
          image: alnaqib/vprofile-db:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: vprodbpass
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/mysql
      volumes:
        - name: db-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: db01
  namespace: vprofile
spec:
  selector:
    app: db01
  ports:
    - port: 3306
      targetPort: 3306

# ---------------- Memcached ----------------
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mc01
  namespace: vprofile
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mc01
  template:
    metadata:
      labels:
        app: mc01
        tier: data
    spec:
      containers:
        - name: mc01
          image: alnaqib/vprofile-mc:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 11211
---
apiVersion: v1
kind: Service
metadata:
  name: mc01
  namespace: vprofile
spec:
  selector:
    app: mc01
  ports:
    - port: 11211
      targetPort: 11211

# ---------------- RabbitMQ ----------------
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rmq01
  namespace: vprofile
spec:
  serviceName: rmq01
  replicas: 1
  selector:
    matchLabels:
      app: rmq01
  template:
    metadata:
      labels:
        app: rmq01
        tier: data
    spec:
      containers:
        - name: rmq01
          image: alnaqib/vprofile-rmq:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5672
            - containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: guest
            - name: RABBITMQ_DEFAULT_PASS
              value: guest
---
apiVersion: v1
kind: Service
metadata:
  name: rmq01
  namespace: vprofile
spec:
  selector:
    app: rmq01
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672

# ---------------- Elasticsearch ----------------
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vprosearch01
  namespace: vprofile
spec:
  serviceName: vprosearch01
  replicas: 1
  selector:
    matchLabels:
      app: vprosearch01
  template:
    metadata:
      labels:
        app: vprosearch01
        tier: data
    spec:
      containers:
        - name: elasticsearch
          image: elasticsearch:7.17.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9200
            - containerPort: 9300
          env:
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: "-Xms256m -Xmx256m"
          resources:
            requests:
              memory: 512Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: 500m
---
apiVersion: v1
kind: Service
metadata:
  name: vprosearch01
  namespace: vprofile
spec:
  selector:
    app: vprosearch01
  ports:
    - name: transport
      port: 9300
      targetPort: 9300
    - name: http
      port: 9200
      targetPort: 9200
