apiVersion: v1
kind: ConfigMap
metadata:
  name: vproweb-config
  namespace: vprofile
data:
  default.conf: |
    upstream vprofile {
        server app01:80;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://vprofile;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vproweb
  namespace: vprofile
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vproweb
  template:
    metadata:
      labels:
        app: vproweb
        tier: frontend
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-config
          configMap:
            name: vproweb-config
---
apiVersion: v1
kind: Service
metadata:
  name: vproweb
  namespace: vprofile
spec:
  selector:
    app: vproweb
  ports:
    - port: 80
      targetPort: 80
